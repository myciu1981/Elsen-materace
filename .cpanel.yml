---
# Wdrożenie elsen.com.pl na cPanel (konto myciu, nethero.pl).
#
# elsen.com.pl jest domeną DODATKOWĄ — jej document root to
# public_html/elsen.com.pl, a nie samo public_html. Tam siedzi tymczasowa
# domena główna konta, więc kopiowanie do public_html nie pokazałoby się
# pod elsen.com.pl.
#
# cPanel przy deployu TYLKO KOPIUJE, nigdy nie usuwa. Dlatego katalogi, które
# w całości pochodzą z builda, kasujemy przed skopiowaniem — inaczej zostają
# w nich pliki wyrzucone z repo. Najbardziej dotyczy to assets/, gdzie nazwy
# mają hash treści: bez czyszczenia narastałyby tam wszystkie stare wersje
# index-*.js z każdego wdrożenia.
#
# Czego NIE ruszamy: elsen-config.php i elsen-quote-failed.log leżą piętro
# wyżej, w katalogu domowym, poza zasięgiem tego wdrożenia. Tak ma zostać —
# klucz Resend nie może wejść do repo ani do katalogu publicznego.
#
# Pliki luzem w korzeniu (index.html, 404.html, .htaccess, robots.txt,
# sitemap.xml, llms.txt, favicon.*, og-image.jpg) są nadpisywane przez cp.
# Gdyby któryś kiedyś zniknął z repo, trzeba go skasować na serwerze ręcznie.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/elsen.com.pl
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rm -rf $DEPLOYPATH/assets $DEPLOYPATH/fonts $DEPLOYPATH/api $DEPLOYPATH/dziekujemy $DEPLOYPATH/polityka-prywatnosci
    - /bin/cp -R site/. $DEPLOYPATH/
